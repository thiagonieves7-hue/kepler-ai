    if(c){const a=nodes[c.a],b=nodes[c.b],al=M.sin(M.PI*(t-c.t)/(1.5+(c.a%3)*.8))*.6,or=S.or>.5;ePos.set([a.x,a.y,a.z,b.x,b.y,b.z],o);eCol.set(or?[al,al*.6,al*.2,al,al*.6,al*.2]:[al*.8,al*.85,al,al*.8,al*.85,al],o)}else eCol.fill(0,o,o+6)}
  eg.attributes.position.needsUpdate=eg.attributes.color.needsUpdate=true;
  /* señales eléctricas con estela */
  let ci=0;
  for(let i=sigs.length-1;i>=0;i--){const s=sigs[i];s.p+=s.sp*dt*(.6+S.E*.9);if(s.p>=1&&!hop(s)){sigs.splice(i,1);continue}eh[s.e]=1;eo[s.e]=s.or?1:0}
  for(const s of sigs){const A=nodes[s.a],B=nodes[s.b],p=M.min(s.p,1),dd=lerp(A.d,B.d,p);
    for(let j=0;j<4;j++){const pp=M.max(0,p-j*.07),n=ci*4+j,o=n*3;sigP.pos[o]=lerp(A.x,B.x,pp);sigP.pos[o+1]=lerp(A.y,B.y,pp);sigP.pos[o+2]=lerp(A.z,B.z,pp);sigP.al[n]=(1-j*.25)*(.3+.7*dd)*coreA;sigP.sz[n]=[.09,.06,.05,.04][j];sigP.or[n]=s.or?1:0}ci++}
  for(let n=ci*4;n<sPrev*4;n++)sigP.al[n]=0;sPrev=ci;up(sigP);
  /* núcleo */
  coreM.uniforms.uT.value=t;coreM.uniforms.uTh.value=S.th;coreM.uniforms.uOr.value=S.or*.6;coreP.mesh.visible=coreA>0;
  const pul=1+.065*M.sin(t*2.2)+.11*S.th*M.sin(t*6)+.025*M.sin(t*11.5),cc=lerp(.45,1,S.or);coreS.scale.setScalar((.8+.5*S.th)*pul);coreS.material.opacity=coreA*(.55+.45*S.th);coreS.material.color.setRGB(1,lerp(1,.62,S.or*.6),lerp(1,.35,S.or*.7));
  haloS.scale.setScalar(3.4+.8*S.th);haloS.material.opacity=coreA*(.1+.12*S.E);
  /* fondo */
  stars[0].material.opacity=bgA*(.6+.3*M.sin(t*.8));stars[1].material.opacity=bgA*(.6+.3*M.sin(t*1.1+2));stars.forEach((s,i)=>s.rotation.y=t*(.004+i*.002));
  dust.material.opacity=bgA*(.34+.08*(.5+.5*M.sin(t*.7)));dust.rotation.y=t*.012;dust.rotation.x=t*.006;gal.material.opacity=bgA*.32;gal.material.rotation=.4+t*.004;
  nebulae.forEach((n,i)=>{n.s.material.opacity=bgA*(.20+.08*M.sin(t*.12+n.b));n.s.material.rotation=n.b+t*(i%2?.001:-.0015)});
  planets.forEach(p=>{p.g.rotation.y=t*p.spin;p.g.position.x+=M.sin(t*.025+p.phase)*.0007;p.g.position.y+=M.cos(t*.019+p.phase)*.00045});

  /* nombre y panel */
  mStep(nameM,dt);
  if(open&&panM.p>=.99)panM.fade=.4+.12*M.sin(t*3);else panM.fade=1;mStep(panM,dt);
  document.body.classList.toggle('chat',open&&panM.p>.85);
  const amp=panM.mesh.visible?1-M.abs(2*panM.p-1):0;tend.visible=amp>.02;
  if(tend.visible){const pe=ease(panM.p),st=outer.length/TN|0,ts=(panM.n*.62/TN)|0;
    for(let q=0;q<TN;q++){const n=nodes[outer[q*st]];tv.set(n.x,n.y,n.z);grp.localToWorld(tv);const j=q*ts*3,o=q*6;
      tp[o]=tv.x;tp[o+1]=tv.y;tp[o+2]=tv.z;tp[o+3]=lerp(tv.x,panM.tg[j],pe);tp[o+4]=lerp(tv.y,panM.tg[j+1],pe);tp[o+5]=lerp(tv.z,0,pe);
      tc.set([.5*amp,.75*amp,amp,.3*amp,.5*amp,amp],o)}tg2.attributes.position.needsUpdate=tg2.attributes.color.needsUpdate=true}
  ren.render(scene,cam)}

/* ===== CHAT ===== */
const log=$d('#log'),inp=$d('#in'),hist=[];let busy=false,greeted=false;
function addMsg(c,tx,type){const el=document.createElement('div');el.className='m '+c;log.appendChild(el);
  if(!type)el.textContent=tx;else{const w=tx.split(' ');let i=0;const iv=setInterval(()=>{el.textContent=w.slice(0,++i).join(' ');log.scrollTop=log.scrollHeight;if(i>=w.length)clearInterval(iv)},45)}log.scrollTop=log.scrollHeight}
function openChat(){if(open)return;open=true;layout();buildPanel();seed(panM);panM.goal=1;showName();
  if(!greeted){greeted=true;setTimeout(()=>addMsg('k','Sistemas en línea. ¿En qué puedo ayudarte?',1),1900)}
  if(!small)setTimeout(()=>inp.focus(),1700)}
function closeChat(){if(!open)return;open=false;stopMic();if('speechSynthesis' in window)speechSynthesis.cancel();if(mode==='speaking')setMode('idle');inp.blur();seed(panM);panM.goal=0}
const toggleChat=()=>open?closeChat():openChat();
/* ===== VOZ DE MAYORDOMO ===== */
let speechTimer=null;
function pickButlerVoice(){
  const voices=speechSynthesis.getVoices();
  const es=voices.filter(v=>/^es(-|_)/i.test(v.lang));
  const preferred=['Jorge','Diego','Alvaro','Álvaro','Pablo','Enrique','Miguel','Google español'];
  return preferred.map(n=>es.find(v=>v.name.toLowerCase().includes(n.toLowerCase()))).find(Boolean)
    || es.find(v=>/male|hombre|natural|neural/i.test(v.name)) || es.find(v=>/^es-ES/i.test(v.lang)) || es[0] || voices.find(v=>/^en-GB/i.test(v.lang)) || voices[0];
}
function speakButler(text){
  if(!('speechSynthesis' in window))return false;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[*_#`]/g,''));
  const v=pickButlerVoice();
  if(v){u.voice=v;u.lang=v.lang||'es-ES'}else u.lang='es-ES';
  u.rate=.86; u.pitch=.82; u.volume=1;
  u.onstart=()=>{clearTimeout(speechTimer);setMode('speaking')};
  u.onend=u.onerror=()=>{clearTimeout(speechTimer);if(mode==='speaking')setMode('idle')};
  speechSynthesis.speak(u);
  return true;
}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

async function send(tx){tx=tx.trim();if(!tx||busy)return;busy=true;inp.value='';addMsg('u',tx);hist.push({role:'user',content:tx});setMode('thinking');
  let r;try{r=await KEPLER.ask(tx,hist);hist.push({role:'assistant',content:r})}catch(e){r='No logro conectar con Kepler. Revisa la dirección de la API en configuración.'}
  addMsg('k',r,1);
  if(!speakButler(r)){setMode('speaking');clearTimeout(speechTimer);speechTimer=setTimeout(()=>{if(mode==='speaking')setMode('idle')},1800+r.length*40)}
  busy=false}
$d('#go').onclick=()=>send(inp.value);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send(inp.value)});inp.addEventListener('input',()=>typingUntil=performance.now()+1200);
addEventListener('keydown',e=>{if(e.key==='Escape'){closeChat();$d('#set').classList.remove('on')}});
/* micrófono */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,listening=false;
function stopMic(auto){if(!listening)return;listening=false;$d('#mic').classList.remove('on');try{rec&&rec.stop()}catch(e){}if(mode==='listening')setMode('idle');const v=inp.value.trim();if(auto&&v)send(v)}
$d('#mic').onclick=()=>{if(listening)return stopMic(true);listening=true;$d('#mic').classList.add('on');setMode('listening');
  if(!SR){addMsg('k','Este navegador no permite voz. Escribe tu mensaje.');setTimeout(()=>stopMic(),1500);return}
  rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;inp.value=s;if(e.results[e.results.length-1].isFinal)stopMic(true)};
  rec.onend=()=>stopMic(true);rec.onerror=()=>stopMic();try{rec.start()}catch(e){stopMic()}};
/* configuración */
const set=$d('#set');$d('#api').value=store.get('api');$d('#q').value=qs;
$d('#gear').onclick=e=>{e.stopPropagation();set.classList.toggle('on')};
document.addEventListener('pointerdown',e=>{if(!set.contains(e.target)&&!$d('#gear').contains(e.target))set.classList.remove('on')});
$d('#api').onchange=e=>store.set('api',e.target.value);$d('#q').onchange=e=>{store.set('q',e.target.value);location.reload()};
